<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Odontólogos - Consultorio Dental</title>
  <!-- Estilos eliminados -->
</head>
<body>
  <header>
    <h1>Consultorio Dental — Odontólogos</h1>
    <nav>
      <!-- Asegúrate que este enlace (index.php) sea correcto -->
      <a href="index.php">← Volver</a>
    </nav>
  </header>

  <main>
    <!-- Formulario -->
    <section class="formulario">
      <h2>Registrar Odontólogo</h2>
      <form id="formOdontologo" autocomplete="off">
        <label>
          <div>Nombre</div>
          <!-- Modificado para pedir solo nombre -->
          <input type="text" id="nombre" placeholder="Ej: Abraham" required>
        </label>

        <label>
          <div>Apellido</div>
          <!-- AÑADIDO -->
          <input type="text" id="apellido" placeholder="Ej: Selano" required>
        </label>
        
        <label>
          <div>Edad</div>
          <!-- AÑADIDO -->
          <input type="number" id="edad" placeholder="30" required>
        </label>

        <!-- CAMPO 'especialidad' ELIMINADO -->
        <!-- CAMPO 'horario' ELIMINADO -->

        <label>
          <div>Número de colegiado</div>
          <input type="text" id="numero_colegiado" placeholder="56" required>
        </label>

        <label>
          <div>Teléfono</div>
          <input type="text" id="telefono" placeholder="9991234567">
        </label>

        <label>
          <div>Correo</div>
          <input type="email" id="correo" placeholder="odontologo@ejemplo.com">
        </label>

        <label>
          <div>Contraseña</div>
          <!-- AÑADIDO (usamos id 'contrasena' sin ñ para JS) -->
          <input type="password" id="contrasena" placeholder="Mínimo 6 caracteres" required>
        </label>

        <div>
          <button type="submit">Guardar Odontólogo</button>
        </div>
      </form>
    </section>

    <!-- Buscador y tabla -->
    <section>
      <section class="buscador">
        <h2>Buscar Odontólogo</h2>
        <div>
          <input type="text" id="busqueda" placeholder="Buscar por nombre, apellido o colegiado...">
          <button id="btnBuscar">Buscar</button>
        </div>
      </section>

      <section class="tabla">
        <h2>Odontólogos Registrados</h2>
        <table id="tablaOdontologos">
          <thead>
            <tr>
              <!-- Columnas adaptadas a la tabla 'doctor' -->
              <th>N° Colegiado</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </section>
  </main>

  <!-- Script adaptado -->
  <script src="script_odontologos.js"></script>
</body>
</html>
