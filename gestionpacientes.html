<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes - Consultorio Dental</title>
  </head>
<body>
  <header>
    <h1> Consultorio Dental - Gestión de Pacientes</h1>
    <nav>
        <a href="index.php">← Volver al Inicio</a> |
        <a href="odontologos.html">Gestionar Odontólogos</a>
    </nav>
  </header>

  <main>
    <section class="formulario">
      <h2>Registrar Paciente (Cliente)</h2>
      <form id="formPaciente">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellido" placeholder="Apellidos" required>
        <input type="text" id="telefono" placeholder="Teléfono">
        <input type="email" id="correo" placeholder="Correo electrónico">
        <textarea id="historial" placeholder="Historial"></textarea>
        <button type="submit">Guardar Paciente</button>
      </form>
    </section>

    <section class="buscador">
      <h2>Buscar Paciente</h2>
      <input type="text" id="busqueda" placeholder="Buscar por nombre, apellido o correo...">
      <button id="btnBuscar">Buscar</button>
    </section>

    <section class="tabla">
      <h2>Pacientes Registrados</h2>
      <table id="tablaPacientes">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Historial</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="citas" id="citasSection" style="display:none;">
      <h2>Historial de Consultas de <span id="nombrePaciente"></span></h2>
      
      <table id="tablaCitas">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>N° Doctor</th>
            <th>N° Consultorio</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button onclick="cerrarCitas()">Cerrar</button>
    </section>
  </main>

  <script src="script_pacientes.js"></script>
</body>
</html>
